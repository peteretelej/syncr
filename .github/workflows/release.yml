name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build binaries
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          COMMIT=$(git rev-parse --short HEAD)
          LDFLAGS="-X main.version=${VERSION} -X main.commit=${COMMIT}"

          mkdir -p dist

          # macOS
          GOOS=darwin GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o dist/syncr-macos-x64 .
          GOOS=darwin GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o dist/syncr-macos-arm64 .

          # Linux
          GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o dist/syncr-linux-x64 .
          GOOS=linux GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o dist/syncr-linux-arm64 .

          # Windows
          GOOS=windows GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o dist/syncr-x64.exe .
          GOOS=windows GOARCH=386 go build -ldflags "${LDFLAGS}" -o dist/syncr-32bit.exe .

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/

  msi:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist/

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create MSI (x64)
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"

          # Create WiX source for x64
          @"
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
            <Product Id="*" Name="syncr" Language="1033" Version="$version.0" Manufacturer="peteretelej" UpgradeCode="8F3E4A2B-1C5D-4E6F-9A8B-7C2D3E4F5A6B">
              <Package InstallerVersion="200" Compressed="yes" InstallScope="perMachine" />
              <MajorUpgrade DowngradeErrorMessage="A newer version is already installed." />
              <MediaTemplate EmbedCab="yes" />
              <Feature Id="ProductFeature" Title="syncr" Level="1">
                <ComponentGroupRef Id="ProductComponents" />
              </Feature>
              <Directory Id="TARGETDIR" Name="SourceDir">
                <Directory Id="ProgramFiles64Folder">
                  <Directory Id="INSTALLFOLDER" Name="syncr" />
                </Directory>
              </Directory>
              <ComponentGroup Id="ProductComponents" Directory="INSTALLFOLDER">
                <Component Id="MainExecutable" Guid="*">
                  <File Id="syncr.exe" Source="dist\syncr-x64.exe" Name="syncr.exe" KeyPath="yes" />
                  <Environment Id="PATH" Name="PATH" Value="[INSTALLFOLDER]" Permanent="no" Part="last" Action="set" System="yes" />
                </Component>
              </ComponentGroup>
            </Product>
          </Wix>
          "@ | Out-File -FilePath syncr-x64.wxs -Encoding UTF8

          & "${env:WIX}bin\candle.exe" syncr-x64.wxs -arch x64
          & "${env:WIX}bin\light.exe" syncr-x64.wixobj -o dist/syncr-x64.msi

      - name: Create MSI (32-bit)
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"

          @"
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
            <Product Id="*" Name="syncr" Language="1033" Version="$version.0" Manufacturer="peteretelej" UpgradeCode="8F3E4A2B-1C5D-4E6F-9A8B-7C2D3E4F5A6C">
              <Package InstallerVersion="200" Compressed="yes" InstallScope="perMachine" />
              <MajorUpgrade DowngradeErrorMessage="A newer version is already installed." />
              <MediaTemplate EmbedCab="yes" />
              <Feature Id="ProductFeature" Title="syncr" Level="1">
                <ComponentGroupRef Id="ProductComponents" />
              </Feature>
              <Directory Id="TARGETDIR" Name="SourceDir">
                <Directory Id="ProgramFilesFolder">
                  <Directory Id="INSTALLFOLDER" Name="syncr" />
                </Directory>
              </Directory>
              <ComponentGroup Id="ProductComponents" Directory="INSTALLFOLDER">
                <Component Id="MainExecutable" Guid="*">
                  <File Id="syncr.exe" Source="dist\syncr-32bit.exe" Name="syncr.exe" KeyPath="yes" />
                  <Environment Id="PATH" Name="PATH" Value="[INSTALLFOLDER]" Permanent="no" Part="last" Action="set" System="yes" />
                </Component>
              </ComponentGroup>
            </Product>
          </Wix>
          "@ | Out-File -FilePath syncr-32bit.wxs -Encoding UTF8

          & "${env:WIX}bin\candle.exe" syncr-32bit.wxs -arch x86
          & "${env:WIX}bin\light.exe" syncr-32bit.wixobj -o dist/syncr-32bit.msi

      - name: Upload MSI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: msi
          path: dist/*.msi

  release:
    needs: [build, msi]
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist/

      - name: Download MSI
        uses: actions/download-artifact@v4
        with:
          name: msi
          path: dist/

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/syncr-macos-x64
            dist/syncr-macos-arm64
            dist/syncr-linux-x64
            dist/syncr-linux-arm64
            dist/syncr-x64.exe
            dist/syncr-32bit.exe
            dist/syncr-x64.msi
            dist/syncr-32bit.msi
            dist/checksums.txt
          generate_release_notes: true
